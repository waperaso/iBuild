limit_req_zone $binary_remote_addr zone=ibuild_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ibuild_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ibuild_auth:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ibuild_conn:10m;
limit_req_status 429;

upstream ibuild_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ibuild.uz www.ibuild.uz admin.ibuild.uz api.ibuild.uz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ibuild.uz;
    ssl_certificate /etc/letsencrypt/live/ibuild.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibuild.uz/privkey.pem;
    return 301 https://ibuild.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ibuild.uz;

    ssl_certificate /etc/letsencrypt/live/ibuild.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibuild.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ibuild-landing;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    limit_conn ibuild_conn 20;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        limit_req zone=ibuild_web burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ibuild.uz;

    ssl_certificate /etc/letsencrypt/live/ibuild.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibuild.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 15m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    limit_conn ibuild_conn 20;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location = /api/auth/login {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location = /api/demo/login {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location /api/applications {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location /api/ {
        limit_req zone=ibuild_api burst=40 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.ibuild.uz;

    ssl_certificate /etc/letsencrypt/live/ibuild.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibuild.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 15m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 30s;
    limit_conn ibuild_conn 30;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/auth/login {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location = /api/demo/login {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location /api/applications {
        limit_req zone=ibuild_auth burst=3 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location /api/ {
        limit_req zone=ibuild_api burst=40 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
    location / {
        limit_req zone=ibuild_web burst=80 nodelay;
        proxy_pass http://ibuild_api;
        include /etc/nginx/ibuild-proxy.conf;
    }
}
